apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress

  annotations:
    nginx.ingress.kubernetes.io/health-check-path: /health

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:

          # Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 12

